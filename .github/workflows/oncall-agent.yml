name: AI On-Call Agent

on:
  repository_dispatch:
    types: [grafana-alert]
  workflow_dispatch:
    inputs:
      alert_name:
        description: Alert title
        required: true
        default: CardPilot API High 5xx Error Rate
      service:
        description: Affected service
        required: true
        default: cardpilot-api
      environment:
        description: Affected environment (development only)
        required: true
        default: development
      severity:
        description: Alert severity
        required: true
        default: critical
      summary:
        description: Alert summary
        required: true
        default: HTTP 5xx error threshold exceeded on /recommendations
      trace_id:
        description: Optional trace ID for correlation
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  investigate:
    name: Investigate Alert & Open Incident PR
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.environment != 'production') ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.environment != 'production')

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cardpilot
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Run AI On-Call Investigation
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cardpilot
          ALERT_NAME: ${{ inputs.alert_name || github.event.client_payload.alert_name }}
          ALERT_SERVICE: ${{ inputs.service || github.event.client_payload.service }}
          ALERT_ENVIRONMENT: ${{ inputs.environment || github.event.client_payload.environment }}
          ALERT_SEVERITY: ${{ inputs.severity || github.event.client_payload.severity }}
          ALERT_SUMMARY: ${{ inputs.summary || github.event.client_payload.summary }}
          ALERT_TRACE_ID: ${{ inputs.trace_id || github.event.client_payload.trace_id }}
          GRAFANA_LOKI_URL: ${{ secrets.GRAFANA_LOKI_URL }}
          GRAFANA_TEMPO_URL: ${{ secrets.GRAFANA_TEMPO_URL }}
          GRAFANA_AUTH_HEADER: ${{ secrets.GRAFANA_AUTH_HEADER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python .github/scripts/oncall_agent.py

      - name: Open Incident Investigation PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain docs/incidents)" ]; then
            echo "No incident report generated."
            exit 0
          fi
          branch="oncall/incident-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "cardpilot-oncall-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "${branch}"
          git add docs/incidents
          git commit -m "docs(oncall): add automated incident investigation report"
          git push -u origin "${branch}"
          gh pr create \
            --title "chore(oncall): incident investigation report" \
            --body "Automated on-call investigation triggered by Grafana alert. See \`docs/incidents/\` for telemetry evidence and root cause analysis." \
            --base main
