name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Lint, Typecheck, Test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Check code formatting (Ruff)
        run: python -m ruff format --check backend

      - name: Run linter (Ruff)
        run: python -m ruff check backend

      - name: Run type checker (mypy)
        run: python -m mypy backend

      - name: Run database migrations (Alembic)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cardpilot
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Run backend tests and enforce engine branch coverage (pytest)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cardpilot
        run: >-
          python -m pytest backend
          --cov=app.engine
          --cov-branch
          --cov-fail-under=90
          --cov-report=term-missing

  frontend:
    name: Frontend (Lint, Typecheck, Build, Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter (ESLint)
        run: npm run lint

      - name: Run typecheck and production build (tsc + Vite)
        run: npm run build

      - name: Run component tests (Vitest)
        run: npm test
