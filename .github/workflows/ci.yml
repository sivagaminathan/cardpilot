name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend (Lint & Typecheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Check code formatting (Ruff)
        run: python -m ruff format --check backend

      - name: Run linter (Ruff)
        run: python -m ruff check backend

      - name: Run type checker (mypy)
        run: python -m mypy backend

  frontend-quality:
    name: Frontend (Lint, Typecheck, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter (ESLint)
        run: npm run lint

      - name: Run typecheck and production build (tsc + Vite)
        run: npm run build

  test:
    name: Automated Tests (make test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify GNU Make is available
        run: make --version

      - name: Set up Python 3.11 and uv
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv and sync backend dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --directory backend --extra dev --frozen

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run database migrations (Alembic)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cardpilot
        run: uv run --directory backend --extra dev alembic upgrade head

      - name: Run backend and frontend tests (make test)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cardpilot
        run: make test
