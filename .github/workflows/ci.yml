name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend (Lint & Typecheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Check code formatting (Ruff)
        run: python -m ruff format --check backend

      - name: Run linter (Ruff)
        run: python -m ruff check backend

      - name: Run type checker (mypy)
        run: python -m mypy backend

  frontend-quality:
    name: Frontend (Lint, Typecheck, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter (ESLint)
        run: npm run lint

      - name: Run typecheck and production build (tsc + Vite)
        run: npm run build

  test:
    name: Automated Tests (make test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify GNU Make is available
        run: make --version

      - name: Set up Python 3.11 and uv
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv and sync backend dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --directory backend --extra dev --frozen

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run database migrations (Alembic)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cardpilot
        run: uv run --directory backend --extra dev alembic upgrade head

      - name: Run backend and frontend tests (make test)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cardpilot
        run: make test

      - name: Check OpenAPI 3.1 export and generated TypeScript types (AC-14)
        run: make openapi-check

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 and uv
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv and sync backend dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --directory backend --extra dev --frozen

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright Chromium
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run database migrations and seed data
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cardpilot
        run: |
          uv run --directory backend --extra dev alembic upgrade head
          uv run --directory backend python -m app.seeds.loader

      - name: Start backend and frontend servers
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cardpilot
          CORS_ORIGINS: http://localhost:5173
          API_TARGET: http://localhost:8000
        run: |
          uv run --directory backend uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          npm --prefix frontend run dev -- --host 0.0.0.0 --port 5173 > /tmp/web.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz > /dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Backend failed to become healthy"
              cat /tmp/api.log
              exit 1
            fi
            sleep 2
          done

          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Frontend failed to become ready"
              cat /tmp/web.log
              exit 1
            fi
            sleep 2
          done

      - name: Run Playwright E2E suite (make e2e)
        run: make e2e

      - name: Upload Playwright failure traces and artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: Security (pip-audit, npm audit, gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11 and uv
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Python dependencies against uv.lock (pip-audit)
        run: |
          python -m pip install --upgrade pip uv
          uv export --directory backend --frozen --no-hashes --no-emit-project --extra dev -o /tmp/requirements-audit.txt
          uvx pip-audit -r /tmp/requirements-audit.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies against package-lock.json (npm audit)
        run: npm --prefix frontend audit --audit-level=high

      - name: Scan repository history for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
