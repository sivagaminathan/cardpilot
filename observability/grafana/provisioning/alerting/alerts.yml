apiVersion: 1

groups:
  - orgId: 1
    name: cardpilot-api-alerts
    folder: CardPilot
    interval: 10s
    rules:
      - uid: cardpilot-api-5xx-high
        title: CardPilot API High 5xx Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(cardpilot_http_requests_total{status_code=~"5.."}[2m])) or vector(0)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: CardPilot API is returning HTTP 5xx errors
          description: More than 2 HTTP 5xx responses observed in the last 2 minutes on cardpilot-api.
          dashboard_uid: cardpilot-api
          runbook_url: https://github.com/sivagaminathan/cardpilot/blob/main/README.md#reproducing-the-controlled-incident
        labels:
          service: cardpilot-api
          environment: development
          severity: critical
